services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data:/app/data
    environment:
      DATABASE_URL: file:/app/data/mysteryweaver.db
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped
    healthcheck:
      # Node 22 has global fetch; /join is a static 200 route, so no extra tooling needed.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/join').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqlite_data:
